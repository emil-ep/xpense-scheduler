spring:
  application:
    name: xpense-scheduler
  datasource:
    url: jdbc:postgresql://localhost:5432/xpense_tracker
    username: xpense_admin
    password: xpenseTracker1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
mutualFund:
  api:
    url: "https://api.mfapi.in/mf"
  job:
    enabled: true

kafka:
  bootstrap:
    server: localhost:9092

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: ['prometheus']
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
